version: 2
updates:
  # Maintains dependencies for the API
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      sentry:
        patterns:
          - "@sentry/*"
  
  # Maintains workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"